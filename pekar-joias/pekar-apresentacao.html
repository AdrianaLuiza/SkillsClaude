<title>Página retirada</title>
<style>
  :root{
    --fundo:#FAF5EC;
    --tinta:#2E241D;
    --suave:#6B5B4C;
    --linha:#E4D5BE;
  }
  body{
    margin:0;
    min-height:100vh;
    background:var(--fundo);
    color:var(--tinta);
    font-family:"Helvetica Neue",Arial,sans-serif;
    display:grid;
    place-items:center;
    padding:2rem;
  }
  main{max-width:34rem;text-align:center}
  h1{
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(1.5rem,5vw,2rem);
    font-weight:600;
    margin:0 0 .9rem;
    line-height:1.2;
  }
  p{margin:0;color:var(--suave);line-height:1.6;font-size:1rem}
  hr{border:0;border-top:1px solid var(--linha);margin:1.8rem auto;width:6rem}
</style>

<main>
  <h1>Esta página foi retirada.</h1>
  <hr>
  <p>O conteúdo não está mais disponível neste endereço.</p>
